name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: python -m pip install --quiet requests scikit-learn matplotlib

      - name: Compile check
        run: >-
          python -m py_compile
          eval_prompts/build_prompts.py
          eval_prompts/build_prompts_v2.py
          eval_prompts/build_legacy_gold.py
          harness/run_oracle.py
          harness/merge_tiers.py
          scoring/extract.py
          scoring/exec_tests.py
          scoring/score.py
          router/heuristic.py
          router/cascade.py
          router/learned.py
          router/budget_router.py
          analysis/make_plot.py
          analysis/report.py
          analysis/tier_table.py
          analysis/verify_results.py
          tests/test_mjolnir.py

      - name: Unit checks (extraction, execution scoring, routers, eval set)
        run: python tests/test_mjolnir.py

      - name: Published numbers match the committed live data
        run: |
          python analysis/verify_results.py
          python - <<'EOF'
          import json, pathlib
          snap = json.loads(pathlib.Path('analysis/results.json').read_text())
          assert snap['prompts'] == 180, snap['prompts']
          assert snap['test_prompts'] == 54, snap['test_prompts']
          assert abs(snap['policies']['oracle']['quality'] - 0.927) < 0.01, snap['policies']['oracle']
          assert abs(snap['policies']['cascade (verified gate)']['quality'] - 0.890) < 0.01, snap['policies']
          print("committed results snapshot OK")
          EOF

      - name: Unit check - legacy metric + routers
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, '.')
          from scoring.score import score_factual, score_code, score_reasoning
          from router.heuristic import route
          from router.cascade import confidence_proxy, cascade
          assert score_factual("The answer is Paris.", "Paris") == 1.0
          assert score_factual("The answer is London.", "Paris") == 0.0
          assert score_code("```python\ndef add(a, b):\n    return a + b\n```", "def add(a, b):\n    return a + b") == 1.0
          assert score_code("def broken(a, b:\n    return a + b", "") == 0.0
          assert score_reasoning("x " * 30 + "\nAnswer: 42", "") == 0.75
          assert route("Write Python factorial(n). Output code only.") in ("turbo", "vector")
          assert route("Why is the sky blue? Explain the steps.") == "ultra"
          assert confidence_proxy("") == 0.0
          assert cascade({"turbo": 0.9}) == "turbo"
          assert cascade({"turbo": 0.0, "vector": 0.0}) == "ultra"
          print("legacy unit checks OK")
          EOF

      - name: Mock pipeline end-to-end (cycle-1 prompt set, legacy metric)
        run: |
          python harness/run_oracle.py --out harness/oracle_smoke.jsonl --mock
          python scoring/score.py --in harness/oracle_smoke.jsonl --out scoring/scores_smoke.jsonl --metric legacy
          python router/learned.py --scores scoring/scores_smoke.jsonl
          python analysis/make_plot.py --scores scoring/scores_smoke.jsonl
          python - <<'EOF'
          import json, pathlib
          scores = [json.loads(l) for l in pathlib.Path('scoring/scores_smoke.jsonl').read_text().splitlines() if l.strip()]
          assert len(scores) == 180, len(scores)
          assert all(r.get('prompt') for r in scores), "prompt passthrough missing"
          assert all('confidence' in (r['tiers'][t] or {}) for r in scores for t in r['tiers']), "confidence missing"
          table = pathlib.Path('analysis/table.md').read_text()
          for name in ('random', 'heuristic', 'cascade', 'learned', 'oracle'):
              assert name in table, name
          print("pipeline checks OK")
          EOF

      - name: Mock pipeline end-to-end (v2 prompt set, format-neutral metric)
        run: |
          python eval_prompts/build_prompts_v2.py --out eval_prompts/prompts_v2.jsonl
          python harness/run_oracle.py --prompts eval_prompts/prompts_v2.jsonl --out harness/oracle_smoke_v2.jsonl --mock
          python scoring/score.py --in harness/oracle_smoke_v2.jsonl --out scoring/scores_smoke_v2.jsonl --metric v2
          python router/learned.py --scores scoring/scores_smoke_v2.jsonl --ablation
          python router/budget_router.py --scores scoring/scores_smoke_v2.jsonl
          python analysis/make_plot.py --scores scoring/scores_smoke_v2.jsonl
          python - <<'EOF'
          import json, pathlib
          rows = [json.loads(l) for l in pathlib.Path('scoring/scores_smoke_v2.jsonl').read_text().splitlines() if l.strip()]
          assert len(rows) == 180, len(rows)
          assert all(r.get('tests') for r in rows if r['task'] == 'code_gen'), "unit tests not carried through"
          assert all('code' in (r['tiers'][t] or {}) for r in rows if r['task'] == 'code_gen' for t in r['tiers']), "extracted code missing"
          table = pathlib.Path('analysis/table.md').read_text()
          for name in ('random', 'heuristic', 'cascade', 'cascade-verified', 'learned', 'oracle'):
              assert name in table, name
          assert 'quality/cost frontier' in table, "budget curve missing"
          curve = json.loads(pathlib.Path('router/budget_curve.json').read_text())
          assert len(curve) >= 3, curve
          print("v2 pipeline checks OK")
          EOF
